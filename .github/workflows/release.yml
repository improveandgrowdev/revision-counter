name: Release

# Push a tag like v1.3.0 → builds revision-counter-1.3.0.zip and publishes a
# GitHub release with it attached. Sites running the plugin then see the update.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER="$(sed -n 's/^[ *]*Version:[[:space:]]*//p' revision-counter.php | head -n1 | tr -d '[:space:]')"
          CONST="$(sed -n "s/^define( 'RVC_VERSION', '\(.*\)' );/\1/p" revision-counter.php)"
          STABLE="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '[:space:]')"
          echo "tag=$TAG header=$HEADER const=$CONST stable=$STABLE"
          [ "$TAG" = "$HEADER" ] && [ "$TAG" = "$CONST" ] && [ "$TAG" = "$STABLE" ] || {
            echo "::error::Tag v$TAG must match Version header, RVC_VERSION and Stable tag"; exit 1; }

      - name: Build zip
        run: ./bin/build-zip.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/revision-counter-${GITHUB_REF_NAME#v}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes
